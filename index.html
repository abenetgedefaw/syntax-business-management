<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Syntax Technology — Business Management</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--danger:#dc2626;--ok:#16a34a;--border:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#0f172a;color:white;padding:20px;position:fixed;inset:0 auto 0 0}.brand{font-size:19px;font-weight:800;margin-bottom:6px}.subbrand{font-size:11px;color:#94a3b8;margin-bottom:24px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:#1e293b;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.top h1{margin:0;font-size:25px}.topright{display:flex;gap:8px;align-items:center}.userpill{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 7px #00000008}.label{color:var(--muted);font-size:13px}.value{font-size:25px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.section{background:white;border:1px solid var(--border);border-radius:14px;padding:18px}.section h2{font-size:17px;margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form .full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}textarea{min-height:80px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--primary);color:white}.btn.secondary{background:#475569}.btn.danger{background:var(--danger)}.btn.light{background:#e2e8f0;color:#0f172a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted)}.badge{padding:4px 8px;border-radius:999px;font-size:11px;background:#dbeafe;color:#1d4ed8}.badge.danger{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#15803d}.hidden{display:none}.mobilebar{display:none}.empty{color:var(--muted);padding:18px;text-align:center}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,95%);background:white;border:1px solid var(--border);padding:28px;border-radius:16px;box-shadow:0 12px 35px #00000012}.loginbox h1{margin-top:0}.loginbox .btn{width:100%;margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#0f172a;color:white;padding:12px 16px;border-radius:9px;display:none;z-index:99}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.info{background:#eff6ff;color:#1e40af;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%;padding:16px;padding-bottom:78px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0f172a;z-index:5;overflow:auto}.mobilebar button{flex:1;min-width:72px;background:transparent;color:#cbd5e1;border:0;padding:10px 5px;font-size:10px}.form{grid-template-columns:1fr}.top{align-items:flex-start}.topright{flex-direction:column;align-items:flex-end}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
</head>
<body><div id="root"><div class="loading">Loading…</div></div><div id="toast" class="toast"></div>
<script>
const CFG=window.SUPABASE_CONFIG||{};
const configured=CFG.url && CFG.publishableKey && !CFG.publishableKey.includes('PASTE_');
let supabase=null, session=null, page='dashboard';
const money=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2})+' ETB';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function showError(x){return `<div class="error">${esc(x)}</div>`}
async function init(){
  try{
    if(!configured){renderSetup();return}
    if(!window.supabase) throw new Error('Supabase library did not load. Check your internet connection.');
    supabase=window.supabase.createClient(CFG.url,CFG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const r=await supabase.auth.getSession();
    if(r.error) throw r.error;
    session=r.data.session;
    supabase.auth.onAuthStateChange((_e,s)=>{session=s;render()});
    render();
  }catch(e){
    document.getElementById('root').innerHTML=
      '<div class="login"><div class="loginbox"><h1>Syntax Technology</h1><div class="error"><b>Startup error:</b><br>'+esc(e.message||String(e))+'</div><p>Please send me a screenshot of this error.</p></div></div>';
  }
}
function renderSetup(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>Syntax Technology</h1><p class="label">Business Management System</p><div class="info">Supabase is not connected yet. Open <b>config.js</b> and paste your <b>Publishable key</b>. The Project URL is already configured.</div><pre style="white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;font-size:12px">publishableKey: 'sb_publishable_...'</pre><p class="label">Do not use a secret/service_role key here.</p></div></div>`}
function loginPage(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>Syntax Technology</h1><p class="label">Business Management System</p><div id="authmsg"></div><label>Email</label><input id="email" type="email" autocomplete="email"><label style="margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="btn" style="width:100%" onclick="signIn()">Sign In</button><button class="btn light" style="width:100%" onclick="signUp()">Create Account</button></div><p class="label" style="margin-top:14px">New accounts start as Employee. Promote the owner account to Admin in Supabase after signup.</p></div></div>`}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await supabase.auth.signInWithPassword({email,password});if(r.error){document.getElementById('authmsg').innerHTML=showError(r.error.message);return}toast('Signed in')}
async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){document.getElementById('authmsg').innerHTML=showError('Enter an email and a password of at least 6 characters.');return}const r=await supabase.auth.signUp({email,password});if(r.error){document.getElementById('authmsg').innerHTML=showError(r.error.message);return}document.getElementById('authmsg').innerHTML=`<div class="info">Account created. If email confirmation is enabled, check your email, then sign in.</div>`}
async function signOut(){await supabase.auth.signOut()}
function nav(){return ['dashboard','income','inventory','services','banners','reports'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x==='dashboard'?'▣':x==='income'?'₿':x==='inventory'?'▤':x==='services'?'⚙':x==='banners'?'▰':'▥'} &nbsp; ${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function shell(content,profile){return `<div class="app"><aside class="side"><div class="brand">Syntax Technology</div><div class="subbrand">Business Management System</div><div class="nav">${nav()}</div></aside><main class="main"><div class="top"><h1>${page[0].toUpperCase()+page.slice(1)}</h1><div class="topright"><span class="userpill">${esc(profile?.full_name||session?.user?.email||'User')}</span><button class="btn secondary" onclick="signOut()">Sign out</button></div></div>${content}</main><div class="mobilebar">${nav()}</div></div>`}
async function profile(){const r=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();return r.data}
async function dashboard(){const [inc,inv,bn,srv]=await Promise.all([supabase.from('income').select('id,total_amount,transaction_date,service_id').order('transaction_date',{ascending:false}).limit(10),supabase.from('inventory').select('*').order('name'),supabase.from('institutional_banners').select('id,total_price,amount_paid,status').order('created_at',{ascending:false}),supabase.from('services').select('*').eq('active',true)]);if(inc.error||inv.error||bn.error||srv.error)return showError((inc.error||inv.error||bn.error||srv.error).message);const total=(inc.data||[]).reduce((a,x)=>a+Number(x.total_amount||0),0),low=(inv.data||[]).filter(x=>Number(x.maximum_capacity)>0&&Number(x.current_stock)<=Number(x.maximum_capacity)*Number(x.threshold_percent||15)/100);return `<div class="cards"><div class="card"><div class="label">Recent Income</div><div class="value">${money(total)}</div></div><div class="card"><div class="label">Inventory Items</div><div class="value">${inv.data.length}</div></div><div class="card"><div class="label">Low Stock</div><div class="value" style="color:${low.length?'var(--danger)':'var(--ok)'}">${low.length}</div></div><div class="card"><div class="label">Institutional Orders</div><div class="value">${bn.data.length}</div></div></div><div class="grid"><div class="section"><h2>Low Stock Alerts</h2>${low.length?`<table><tr><th>Item</th><th>Current</th><th>Threshold</th></tr>${low.map(x=>`<tr><td>${esc(x.name)}</td><td><span class="badge danger">${x.current_stock} ${esc(x.unit)}</span></td><td>${(Number(x.maximum_capacity)*Number(x.threshold_percent||15)/100).toFixed(1)}</td></tr>`).join('')}</table>`:'<div class="empty">No low-stock items.</div>'}</div><div class="section"><h2>Recent Income</h2>${inc.data.length?`<table><tr><th>Date</th><th>Total</th></tr>${inc.data.map(x=>`<tr><td>${new Date(x.transaction_date).toLocaleString()}</td><td>${money(x.total_amount)}</td></tr>`).join('')}</table>`:'<div class="empty">No income records.</div>'}</div></div>`}
async function income(){const r=await supabase.from('income').select('id,description,quantity,unit_price,total_amount,payment_method,transaction_date,customers(name),services(name)').order('transaction_date',{ascending:false}).limit(100);if(r.error)return showError(r.error.message);return `<div class="grid"><div class="section"><h2>Record Income</h2><div class="form"><div><label>Customer</label><input id="iCustomer"></div><div><label>Service</label><select id="iService"><option>Passport Appointment</option><option>ID Printing</option><option>Key Cutting</option><option>Photocopying</option><option>Individual Banner</option><option>Other</option></select></div><div><label>Description</label><input id="iDesc"></div><div><label>Payment Method</label><select id="iPay"><option value="cash">Cash</option><option value="bank">Bank</option><option value="mobile_money">Mobile Money</option><option value="other">Other</option></select></div><div><label>Quantity</label><input id="iQty" type="number" value="1" min="1"></div><div><label>Unit Price (ETB)</label><input id="iPrice" type="number" value="0" min="0"></div></div><div class="actions"><button class="btn" onclick="addIncome()">Save Income</button></div></div><div class="section"><h2>Transactions</h2><table><tr><th>Date</th><th>Customer</th><th>Service</th><th>Total</th></tr>${r.data.map(x=>`<tr><td>${new Date(x.transaction_date).toLocaleDateString()}</td><td>${esc(x.customers?.name||'—')}</td><td>${esc(x.services?.name||x.description||'—')}</td><td>${money(x.total_amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No records</td></tr>'}</table></div></div>`}
async function getOrCreateCustomer(name){if(!name)return null;let r=await supabase.from('customers').select('id').eq('name',name).limit(1).maybeSingle();if(r.data)return r.data.id;const ins=await supabase.from('customers').insert({name}).select('id').single();return ins.data?.id||null}
async function getServiceId(name){const r=await supabase.from('services').select('id').eq('name',name).maybeSingle();return r.data?.id||null}
async function addIncome(){const name=document.getElementById('iCustomer').value.trim(),service=document.getElementById('iService').value,desc=document.getElementById('iDesc').value.trim(),qty=Number(document.getElementById('iQty').value||1),price=Number(document.getElementById('iPrice').value||0),payment_method=document.getElementById('iPay').value;const customer_id=await getOrCreateCustomer(name);const service_id=await getServiceId(service);const r=await supabase.from('income').insert({customer_id,service_id,description:desc,quantity:qty,unit_price:price,payment_method,employee_id:session.user.id}).select().single();if(r.error)return toast(r.error.message);toast('Income saved');go('income')}
async function inventory(){const r=await supabase.from('inventory').select('*').order('name');if(r.error)return showError(r.error.message);return `<div class="grid"><div class="section"><h2>Add Inventory Item</h2><div class="form"><div><label>Item name</label><input id="invName"></div><div><label>Category</label><input id="invCat"></div><div><label>Unit</label><input id="invUnit" placeholder="piece, meter, roll"></div><div><label>Maximum capacity</label><input id="invMax" type="number" min="0"></div><div><label>Current stock</label><input id="invCurrent" type="number" min="0"></div><div><label>Unit cost (ETB)</label><input id="invCost" type="number" min="0"></div></div><div class="actions"><button class="btn" onclick="addInv()">Save Item</button></div></div><div class="section"><h2>Inventory</h2><table><tr><th>Item</th><th>Current</th><th>Capacity</th><th>Status</th><th>Stock</th></tr>${r.data.map(x=>{let low=Number(x.maximum_capacity)>0&&Number(x.current_stock)<=Number(x.maximum_capacity)*Number(x.threshold_percent||15)/100;return `<tr><td>${esc(x.name)}</td><td>${x.current_stock} ${esc(x.unit)}</td><td>${x.maximum_capacity}</td><td><span class="badge ${low?'danger':'ok'}">${low?'LOW':'OK'}</span></td><td><button class="btn light" onclick="adjustStock('${x.id}','incoming')">+ Add</button> <button class="btn light" onclick="adjustStock('${x.id}','used')">− Use</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No inventory items</td></tr>'}</table></div></div>`}
async function addInv(){const name=document.getElementById('invName').value.trim();if(!name)return toast('Enter item name');const max=Number(document.getElementById('invMax').value||0),current=Number(document.getElementById('invCurrent').value||0),r=await supabase.from('inventory').insert({name,category:document.getElementById('invCat').value.trim(),unit:document.getElementById('invUnit').value.trim()||'piece',maximum_capacity:max,current_stock:current,unit_cost:Number(document.getElementById('invCost').value||0),threshold_percent:15}).select().single();if(r.error)return toast(r.error.message);toast('Inventory item saved');go('inventory')}
async function adjustStock(id,type){const q=prompt(type==='incoming'?'Quantity received:':'Quantity used:');if(q===null)return;const qty=Number(q);if(!qty||qty<=0)return toast('Enter a valid quantity');const reason=prompt('Reason / note (optional):')||null;const r=await supabase.rpc('adjust_inventory',{p_inventory_id:id,p_transaction_type:type,p_quantity:qty,p_reason:reason});if(r.error)return toast(r.error.message);toast('Stock updated');go('inventory')}
async function services(){const r=await supabase.from('passport_appointments').select('id,appointment_type,appointment_date,status,price,customers(name),created_at').order('created_at',{ascending:false}).limit(50);if(r.error)return showError(r.error.message);return `<div class="section"><h2>Individual Customer Services</h2><p class="label">Use the service module for passport appointments. The next iteration will add dedicated forms for ID printing, key cutting and photocopying.</p><div class="form"><div><label>Customer</label><input id="sCustomer"></div><div><label>Phone</label><input id="sPhone"></div><div><label>Appointment type</label><input id="sType" placeholder="Urgent, regular, renewal..."></div><div><label>Appointment date</label><input id="sDate" type="date"></div><div><label>Price (ETB)</label><input id="sPrice" type="number" value="0"></div><div><label>Status</label><select id="sStatus"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div></div><div class="actions"><button class="btn" onclick="addPassport()">Save Passport Appointment</button></div></div><div class="section" style="margin-top:18px"><h2>Passport Appointments</h2><table><tr><th>Customer</th><th>Type</th><th>Date</th><th>Status</th><th>Price</th></tr>${r.data.map(x=>`<tr><td>${esc(x.customers?.name||'—')}</td><td>${esc(x.appointment_type||'—')}</td><td>${esc(x.appointment_date||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.price)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No appointments</td></tr>'}</table></div>`}
async function addPassport(){const name=document.getElementById('sCustomer').value.trim();if(!name)return toast('Enter customer name');const customer_id=await getOrCreateCustomer(name);const r=await supabase.from('passport_appointments').insert({customer_id,appointment_type:document.getElementById('sType').value,appointment_date:document.getElementById('sDate').value||null,status:document.getElementById('sStatus').value,price:Number(document.getElementById('sPrice').value||0),employee_id:session.user.id}).select().single();if(r.error)return toast(r.error.message);toast('Appointment saved');go('services')}
async function banners(){const r=await supabase.from('institutional_banners').select('id,project_title,width,height,quantity,total_price,amount_paid,balance,status,deadline,institutions(name,contact_person,phone)').order('created_at',{ascending:false}).limit(100);if(r.error)return showError(r.error.message);return `<div class="section"><h2>Institutional Banner Project</h2><div class="form"><div><label>Institution name</label><input id="bInst"></div><div><label>Contact person</label><input id="bContact"></div><div><label>Phone</label><input id="bPhone"></div><div><label>Project title</label><input id="bTitle"></div><div><label>Width (cm)</label><input id="bW" type="number"></div><div><label>Height (cm)</label><input id="bH" type="number"></div><div><label>Quantity</label><input id="bQty" type="number" value="1"></div><div><label>Material</label><input id="bMat" placeholder="Flex, vinyl, etc."></div><div><label>Total price (ETB)</label><input id="bTotal" type="number"></div><div><label>Amount paid (ETB)</label><input id="bPaid" type="number"></div><div><label>Deadline</label><input id="bDeadline" type="date"></div><div><label>Status</label><select id="bStatus"><option value="new">NEW</option><option value="designing">DESIGNING</option><option value="waiting_approval">WAITING FOR APPROVAL</option><option value="approved">APPROVED</option><option value="printing">PRINTING</option><option value="ready">READY</option><option value="delivered">DELIVERED</option><option value="completed">COMPLETED</option></select></div><div class="full"><label>Description / design requirements</label><textarea id="bDesc"></textarea></div></div><div class="actions"><button class="btn" onclick="addBanner()">Save Institutional Order</button></div></div><div class="section" style="margin-top:18px"><h2>Institutional Orders</h2><table><tr><th>Institution</th><th>Project</th><th>Size</th><th>Balance</th><th>Status</th></tr>${r.data.map(x=>`<tr><td>${esc(x.institutions?.name||'—')}</td><td>${esc(x.project_title)}</td><td>${x.width||'—'}×${x.height||'—'}</td><td>${money(x.balance)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No institutional orders</td></tr>'}</table></div>`}
async function getOrCreateInstitution(name,contact,phone){if(!name)return null;let r=await supabase.from('institutions').select('id').eq('name',name).limit(1).maybeSingle();if(r.data)return r.data.id;const ins=await supabase.from('institutions').insert({name,contact_person:contact,phone}).select('id').single();return ins.data?.id||null}
async function addBanner(){const inst=document.getElementById('bInst').value.trim();if(!inst)return toast('Enter institution name');const institution_id=await getOrCreateInstitution(inst,document.getElementById('bContact').value.trim(),document.getElementById('bPhone').value.trim());const r=await supabase.from('institutional_banners').insert({institution_id,project_title:document.getElementById('bTitle').value.trim()||'Banner Project',description:document.getElementById('bDesc').value.trim(),width:Number(document.getElementById('bW').value||0),height:Number(document.getElementById('bH').value||0),quantity:Number(document.getElementById('bQty').value||1),material:document.getElementById('bMat').value.trim(),total_price:Number(document.getElementById('bTotal').value||0),amount_paid:Number(document.getElementById('bPaid').value||0),deadline:document.getElementById('bDeadline').value||null,status:document.getElementById('bStatus').value}).select().single();if(r.error)return toast(r.error.message);toast('Institutional order saved');go('banners')}
async function reports(){const [inc,bn,srv,inv]=await Promise.all([supabase.from('income').select('total_amount,services(name)'),supabase.from('institutional_banners').select('id,total_price,amount_paid,status'),supabase.from('passport_appointments').select('id'),supabase.from('inventory').select('*')]);if(inc.error||bn.error||srv.error||inv.error)return showError((inc.error||bn.error||srv.error||inv.error).message);let total=inc.data.reduce((a,x)=>a+Number(x.total_amount||0),0),by={};inc.data.forEach(x=>{const k=x.services?.name||'Other';by[k]=(by[k]||0)+Number(x.total_amount||0)});return `<div class="cards"><div class="card"><div class="label">Recorded Income</div><div class="value">${money(total)}</div></div><div class="card"><div class="label">Institutional Orders</div><div class="value">${bn.data.length}</div></div><div class="card"><div class="label">Passport Jobs</div><div class="value">${srv.data.length}</div></div><div class="card"><div class="label">Low Stock</div><div class="value">${inv.data.filter(x=>Number(x.maximum_capacity)>0&&Number(x.current_stock)<=Number(x.maximum_capacity)*Number(x.threshold_percent||15)/100).length}</div></div></div><div class="grid"><div class="section"><h2>Income by Service</h2><table><tr><th>Service</th><th>Income</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No income data</td></tr>'}</table></div><div class="section"><h2>Weekly Email</h2><p class="label">The secure production email automation will run on the backend. This screen is ready for that integration.</p><button class="btn" onclick="toast('Weekly email automation will be enabled after the backend email function is added.')">Test Report</button></div></div>`}
async function pageContent(){if(page==='dashboard')return await dashboard();if(page==='income')return await income();if(page==='inventory')return await inventory();if(page==='services')return await services();if(page==='banners')return await banners();return await reports()}
async function go(x){page=x;render()}
async function render(){if(!configured){renderSetup();return}if(!session){loginPage();return}document.getElementById('root').innerHTML='<div class="loading">Loading…</div>';const [content,p]=await Promise.all([pageContent(),profile()]);document.getElementById('root').innerHTML=shell(content,p)}
init();
</script></body></html>
